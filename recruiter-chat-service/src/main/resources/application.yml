server:
  port: 8087

spring:
  application:
    name: recruiter-chat-service
  datasource:
    url: jdbc:postgresql://localhost:5435/chat_db
    username: postgres
    password: "2401301024"
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update # Auto-create tables for chat if missing
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:${SPRING_REDIS_HOST:redis}}
      port: ${SPRING_DATA_REDIS_PORT:${SPRING_REDIS_PORT:6379}}
  ai:
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        enabled: ${USE_OLLAMA_CHAT:false} # Set true only if running 100% offline without internet
        model: ${OLLAMA_CHAT_MODEL:qwen2.5:1.5b}
      embedding:
        enabled: true
        model: nomic-embed-text
    openai:
      base-url: ${GROQ_BASE_URL:https://api.groq.com/openai}
      api-key: ${GROQ_API_KEY_CHAT:${GROQ_API_KEY:}}
      chat:
        enabled: ${USE_OPENAI_CHAT:true} # Default = Groq Cloud (Ultra-fast response)
        options:
          model: ${GROQ_MODEL_CHAT:${GROQ_MODEL:qwen/qwen3.8-27b}}
          max-tokens: 2048
          temperature: 0.3
      embedding:
        enabled: false # Embeddings always handled locally/efficiently via nomic-embed-text
    vectorstore:
      pgvector:
        dimension: 768
        distance-type: COSINE_DISTANCE
        initialize-schema: true
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: recruiter-chat-group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
        spring.json.use.type.headers: false
        spring.json.value.default.type: java.util.HashMap
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false
  cloud:
    openfeign:
      circuitbreaker:
        enabled: true


eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,circuitbreakers
  endpoint:
    health:
      show-details: always
    prometheus:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

resilience4j:
  circuitbreaker:
    configs:
      default:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 5
        minimumNumberOfCalls: 5
        failureRateThreshold: 100
        waitDurationInOpenState: 30s
        permittedNumberOfCallsInHalfOpenState: 1
        automaticTransitionFromOpenToHalfOpenEnabled: true
        registerHealthIndicator: true
    instances:
      ai-screening-service:
        baseConfig: default
  retry:
    configs:
      default:
        maxAttempts: 3
        waitDuration: 1s
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2
    instances:
      ai-screening-service:
        baseConfig: default
  timelimiter:
    configs:
      default:
        timeoutDuration: 30s
    instances:
      ai-screening-service:
        timeoutDuration: 30s