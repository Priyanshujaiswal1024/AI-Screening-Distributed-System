server:
  port: 8075

spring:
  application:
    name: ai-screening-service

  datasource:
    url: jdbc:postgresql://localhost:5435/screening_db
    username: postgres
    password: "2401301024"
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  kafka:
    bootstrap-servers: localhost:9092

    consumer:
      group-id: ai-screening-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        # CRITICAL FIX: do NOT set default.type to a class — consumer methods declare Map<String,Object>
        # Spring Kafka infers the target type from the @KafkaListener method signature.
        # Setting default.type to ResumeUploadedEvent caused MismatchedInputException
        # on every message → 3 retries → DLT → pipeline never progressed to SCREENED.
        spring.json.trusted.packages: "*"
        spring.json.use.type.headers: false
        spring.json.value.default.type: java.util.LinkedHashMap
        spring.kafka.consumer.properties.max.poll.interval.ms: 900000
        max.poll.interval.ms: 900000

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

  cloud:
    openfeign:
      circuitbreaker:
        enabled: true

  ai:
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        enabled: ${USE_OLLAMA_CHAT:false} # Set true only if running 100% offline without internet
        model: ${OLLAMA_CHAT_MODEL:qwen2.5:1.5b}
      embedding:
        enabled: true
        model: nomic-embed-text

    openai:
      base-url: ${GROQ_BASE_URL:https://api.groq.com/openai}
      api-key: ${GROQ_API_KEY_SCREENING:${GROQ_API_KEY:}}
      chat:
        enabled: ${USE_OPENAI_CHAT:true} # Default = Groq Cloud (Ultra-fast 0.3s response)
        options:
          model: ${GROQ_MODEL_SCREENING:${GROQ_MODEL:openai/gpt-oss-20b}}
          max-tokens: 4096
          temperature: 0.1
      embedding:
        enabled: false # Embeddings always handled locally/efficiently via nomic-embed-text

    vectorstore:
      pgvector:
        dimension: 768
        distance-type: COSINE_DISTANCE
        initialize-schema: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,circuitbreakers
  endpoint:
    health:
      show-details: always
    prometheus:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

resilience4j:
  circuitbreaker:
    configs:
      default:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 5
        minimumNumberOfCalls: 5
        failureRateThreshold: 100
        waitDurationInOpenState: 30s
        permittedNumberOfCallsInHalfOpenState: 1
        automaticTransitionFromOpenToHalfOpenEnabled: true
        registerHealthIndicator: true
    instances:
      resume-management-service:
        baseConfig: default
  retry:
    configs:
      default:
        maxAttempts: 3
        waitDuration: 1s
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2
    instances:
      resume-management-service:
        baseConfig: default
  timelimiter:
    configs:
      default:
        timeoutDuration: 5s
    instances:
      resume-management-service:
        timeoutDuration: 5s

aws:
  s3:
    bucket: ${AWS_S3_BUCKET:talent-intelligence-resumes-2026}
    region: ${AWS_REGION:eu-north-1}
    access-key: ${AWS_ACCESS_KEY_ID:}
    secret-key: ${AWS_SECRET_ACCESS_KEY:}